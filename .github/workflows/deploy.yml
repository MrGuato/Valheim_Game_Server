name: deploy
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    # documentation-only changes do not need a redeploy of the live server
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'index.html'
  workflow_dispatch:

jobs:
  deploy:
    name: Local deploy on Valheim host
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy script
        run: |
          bash -euxo pipefail /home/game_server/bin/deploy_valheim.sh
